<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Volleyball Lineup Tracker</title>
      <meta name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

      <!-- iOS home-screen app settings -->
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <meta name="apple-mobile-web-app-title" content="Lineup">

      <!-- App icon (add this file to your repo) -->
      <link rel="apple-touch-icon" href="vb-icon192.png">
      <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0.5rem;
      background: #111;
      color: #f5f5f5;
      touch-action: manipulation;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0.5rem 0;
      text-align: center;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.5rem;
      background: #1b1b1b;
    }

    section {
      margin-bottom: 0.6rem;
    }

    #import-area {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    #lineup-input {
      width: 100%;
      min-height: 70px;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.4rem;
      font-size: 0.8rem;
    }

    button {
      padding: 0.3rem 0.6rem;
      margin: 0.1rem;
      border-radius: 4px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #f5f5f5;
      font-size: 0.8rem;
    }

    button:disabled {
      opacity: 0.4;
    }

    button.primary {
      background: #2b7cff;
      border-color: #2b7cff;
      color: #fff;
    }

    button.danger {
      background: #b00020;
      border-color: #b00020;
      color: #fff;
    }

    button.toggle-on {
      background: #0e8a3a;
      border-color: #0e8a3a;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.3rem 0.4rem;
    }

    .score {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      gap: 0.6rem;
      align-items: baseline;
    }

    .score span span {
      font-size: 1.8rem;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: center;
      margin-top: 0.3rem;
    }

    .controls-row button {
      font-size: 0.95rem;
      padding: 0.45rem 0.9rem;
    }

    .big-score {
      font-size: 1.15rem;
      padding: 0.55rem 1.1rem;
      font-weight: 600;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .panel {
      flex: 1 1 200px;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.4rem;
      min-height: 120px;
    }

    .panel h2 {
      font-size: 0.9rem;
      margin: 0 0 0.3rem 0;
    }

    #court {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      /* Grows rather than clipping: the meta line now carries the target and
         a marker, and long names wrap. */
      grid-auto-rows: minmax(72px, auto);
      gap: 0.25rem;
    }

    .court-cell {
      border-radius: 6px;
      border: 1px solid #444;
      background: #18232e;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 0.2rem;
      font-size: 0.7rem;
      text-align: center;
    }

    .court-cell.empty {
      opacity: 0.5;
      font-style: italic;
    }

    .pos-label {
      font-size: 0.7rem;
      opacity: 0.8;
      text-align: left;
      margin-bottom: 0.1rem;
    }

    .player-card {
      width: 100%;
      border-radius: 6px;
      padding: 0.25rem;
      border: 1px solid #555;
      background: #222;
      cursor: pointer;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Lineup import from a QR code or link. */
    #scan-holder {
      margin-top: 0.3rem;
    }

    #scan-holder video {
      width: 100%;
      max-width: 320px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #000;
    }

    .scan-hint {
      margin-top: 0.15rem;
    }

    .player-name {
      font-size: 1.0rem;
      font-weight: 600;
      margin-bottom: 0.1rem;
    }

    .player-meta {
      font-size: 0.75rem;
      opacity: 0.85;
      line-height: 1.25;
    }

    #bench-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .sub-pending {
      border: 2px solid #f4d03f !important;
      box-shadow: 0 0 4px #f4d03f;
    }

    .not-in-yet {
      font-size: 0.7rem;
      color: #c9a227;
      margin-top: 0.1rem;
    }

    /* Own line: court cells are only about 60px wide, so an inline marker
       wraps mid-number and spills out of the cell. */
    .target-met {
      display: block;
      color: #c9a227;
    }

    #bench-participation {
      margin-top: 0.3rem;
    }

    .target-row {
      display: flex;
      align-items: center;
      margin-top: 0.4rem;
    }

    #target-input {
      width: 3.5rem;
      margin-left: 0.3rem;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.15rem 0.25rem;
      font-size: 0.8rem;
    }

    .target-help {
      margin-top: 0.15rem;
    }

    #subs-log-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.8rem;
    }

    .sub-entry {
      padding: 0.2rem 0;
      border-bottom: 1px solid #333;
    }

    .small-label {
      font-size: 0.7rem;
      opacity: 0.7;
    }

    /* Their servers x our rotations, and the post-match review. */
    .review-section {
      margin-top: 0.4rem;
    }

    .panel-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
    }

    .collapsible {
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.4rem;
      margin-top: 0.3rem;
      font-size: 0.8rem;
      overflow-x: auto;
    }

    .grid-read {
      color: #c9a227;
      margin-bottom: 0.25rem;
    }

    table.grid {
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    table.grid th,
    table.grid td {
      border: 1px solid #333;
      padding: 0.15rem 0.35rem;
      text-align: center;
      white-space: nowrap;
    }

    table.grid th {
      font-weight: 600;
      opacity: 0.85;
    }

    table.grid td.empty {
      opacity: 0.35;
    }

    .review-set,
    .review-player {
      padding: 0.15rem 0;
      border-bottom: 1px solid #262626;
      white-space: nowrap;
    }

    .review-players {
      margin-top: 0.4rem;
    }

    .serving-indicator {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid #555;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .serving-us {
      background: #0e8a3a;
    }

    .serving-them {
      background: #8a4b0e;
    }

    /* Rally log: clock, the transient serve-miss tap, the set-chance line. */
    .rally-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .serve-miss-tap {
      font-size: 0.7rem;
      padding: 0.1rem 0.35rem;
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #c9a227;
      cursor: pointer;
    }

    .serve-miss-tap.flagged {
      background: #c9a227;
      color: #111;
    }

    #set-chance {
      color: #c9a227;
    }

    /* Serving tiers: the coach's prior, shown beside the read. Never red. */
    .medal {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid #111;
      cursor: pointer;
      flex: none;
    }

    .medal-gold { background: #c9a227; }
    .medal-silver { background: #9aa0a6; }
    .medal-bronze { background: #8c6239; }

    .player-card .medal {
      position: relative;
      top: 1px;
      margin-left: 0.25rem;
    }

    #next-up {
      margin-top: 0.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
    }

    #serve-cap-select {
      font-size: 0.8rem;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
    }

    .saved-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem;
    }

    .saved-controls select {
      font-size: 0.8rem;
      max-width: 180px;
    }

    .saved-controls button {
      font-size: 0.85rem;
      padding: 0.35rem 0.8rem;
    }

    /* Run / timeout strip. Muted gold like the other markers - never red,
       which is reserved for rules. */
    .strip-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
      justify-content: center;
      margin-top: 0.3rem;
    }

    #swap-at-input {
      width: 3.5rem;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.15rem 0.25rem;
      font-size: 0.8rem;
    }

    .run-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.3rem;
      padding: 0.3rem 0.45rem;
      border: 1px solid #c9a227;
      border-radius: 6px;
      color: #c9a227;
      font-size: 0.85rem;
    }

    .run-strip .strip-fact {
      color: #ddd;
    }

    .swap-gauge {
      display: inline-block;
      width: 56px;
      height: 6px;
      border: 1px solid #c9a227;
      border-radius: 3px;
      overflow: hidden;
    }

    .swap-gauge-fill {
      display: block;
      height: 100%;
      background: #c9a227;
    }

    .strip-dismiss {
      margin-left: auto;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.75rem;
    }

    .bottom-section {
      margin-top: 0.4rem;
    }

    /* Opponent serving rotation. Jersey numbers only - never names. */
    .opp-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    #opponent-name,
    #opp-server-input {
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.15rem 0.3rem;
      font-size: 0.8rem;
    }

    #opponent-name {
      width: 9rem;
    }

    #opp-server-input {
      width: 3.5rem;
    }

    .opp-jersey {
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* A long run by one server: bigger, gold, same accent as the other
       markers. Prominence only - it never blocks or prompts. */
    .opp-run {
      font-size: 1.1rem;
      color: #c9a227;
    }

    .opp-run .opp-jersey {
      font-size: 1.1rem;
    }

    .opp-run-count {
      font-weight: 700;
    }

    #opp-order-row {
      margin-top: 0.3rem;
    }

    .opp-slot-input {
      width: 2.6rem;
      background: #111;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.15rem 0.2rem;
      font-size: 0.8rem;
      text-align: center;
    }

    .opp-slot-input.serving-slot {
      border-color: #0e8a3a;
    }

    .opp-link {
      color: #7fb2ff;
      font-size: 0.7rem;
      cursor: pointer;
      text-decoration: underline;
    }

    #opp-carried-note,
    #opp-conceded {
      margin-top: 0.2rem;
    }

    .opp-panel {
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.4rem;
      margin-top: 0.3rem;
      font-size: 0.8rem;
      max-height: 160px;
      overflow-y: auto;
    }

    .opp-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0;
      border-bottom: 1px solid #333;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Volleyball Lineup Tracker</h1>

  <!-- Lineup Import -->
  <section id="import-area">
    <label for="lineup-input" class="small-label">
      Lineup (one name per line in serving order) then bench (any order).
    </label>
    <textarea id="lineup-input" placeholder="e.g.
Setter
Middle 1
Outside 1
Opposite
Middle 2
Outside 2
DS 1
DS 2"></textarea>
    <div style="display:flex; gap:0.35rem; flex-wrap:wrap;">
      <button id="load-lineup-btn" class="primary">Load / Update<br>Lineup</button>
      <button id="scan-qr-btn" hidden>Scan lineup QR</button>

      <!-- Rotation buttons moved here -->
      <div>
          <span class="small-label">Rotate</span>
          
          <button id="rotate-back-btn">◀︎</button>
          <button id="rotate-forward-btn">▶︎</button>
        <span class="small-label">Serving:</span>
        <span id="serving-indicator" class="serving-indicator serving-us">Us</span>
      </div>
    </div>
    <div id="scan-holder" hidden></div>

  </section>

  <!-- Status & Controls -->
  <section>
    <div class="status-row">
      <div>Set: <span id="set-number">1</span></div>
      <div class="score">
        <span>Us: <span id="our-score">0</span></span>
        <span>Them: <span id="their-score">0</span></span>
      </div>

      <div class="rally-meta">
        <span id="clock-readout" class="small-label"></span>
        <span id="serve-miss-tap" class="serve-miss-tap" hidden>missed serve</span>
        <span id="set-chance" class="small-label" hidden></span>
      </div>
    </div>
    <div id="next-up" class="small-label"></div>

    <div class="controls-row">

      <button id="score-us-btn" class="primary big-score">Us +1</button>
      <button id="score-them-btn" class="primary big-score">Them +1</button>

      <button id="undo-btn">Undo</button>
      <button id="new-set-btn">New Set</button>

      <button id="sub-mode-btn">Sub Mode: Off</button>
    </div>

    <div class="strip-controls">
      <button id="timeout-us-btn">Timeout us (2)</button>
      <button id="timeout-them-btn">Timeout them (2)</button>
      <label for="swap-at-input" class="small-label">Swap at combined</label>
      <input id="swap-at-input" type="number" min="1" step="1" value="20">
      <button id="strip-toggle-btn">Strip: On</button>
    </div>

    <div id="run-strip" class="run-strip" hidden></div>
  </section>

  <!-- Opponent serving rotation (jersey numbers only, this device only) -->
  <section id="opponent-area">
    <div class="status-row">
      <div class="opp-row">
        <label for="opponent-name" class="small-label">Opponent</label>
        <input id="opponent-name" type="text" placeholder="Team name" maxlength="40">
      </div>
      <div id="opp-server-control" class="opp-row small-label"></div>
      <button id="opp-order-btn">Their order</button>
      <button id="opponents-btn">Opponents</button>
    </div>
    <div id="opp-order-row" class="opp-row" hidden></div>
    <div id="opp-carried-note" class="small-label"></div>
    <div id="opp-conceded" class="small-label"></div>
    <div id="opponents-panel" class="opp-panel" hidden></div>
  </section>

  <!-- Layout: Court / Bench / Game Log -->
  <section class="layout">
    <div class="panel">
      <h2>Court</h2>
      <div id="court"></div>
    </div>

    <div class="panel">
      <h2>Bench</h2>
      <div id="bench-list"></div>
      <div id="bench-participation" class="small-label"></div>
      <div class="target-row small-label">
        <label for="target-input">25% target</label>
        <input id="target-input" type="number" min="0" step="1" value="38">
      </div>
      <div class="small-label target-help">
        38 clears 25% of a 3-set match that goes 26-24 every set.
      </div>
    </div>

    <div class="panel">
      <h2>Game Log</h2>
      <div id="subs-log-list"></div>
    </div>
  </section>

  <!-- Their servers x our rotations, and the post-match review -->
  <section class="review-section">
    <div class="panel-toggles">
      <button id="grid-toggle-btn">Their servers</button>
      <button id="review-toggle-btn">Review</button>
    </div>
    <div id="grid-panel" class="collapsible" hidden></div>
    <div id="review-panel" class="collapsible" hidden></div>
  </section>

  <!-- Saved games + Reset (bottom of view) -->
  <section class="bottom-section">
    <div class="status-row">
      <div class="small-label">Game Management (this device only)</div>
      <div class="saved-controls">
        <button id="save-game-btn">Save Game</button>
        <select id="saved-games-select"></select>
        <button id="load-game-btn">Load</button>
        <button id="delete-game-btn">Delete</button>
        <button id="export-rallies-btn">Export rally log</button>
        <button id="chance-toggle-btn">Set chance: Off</button>
        <label for="serve-cap-select" class="small-label">Serve cap</label>
        <select id="serve-cap-select">
          <option value="none">none</option>
          <option value="5">5 points</option>
        </select>
        <button id="reset-btn" class="danger">Reset App</button>
      </div>
    </div>
  </section>
</div>

<script>
  // --------- Storage keys ---------
  const STORAGE_KEY_AUTO = 'vb_lineup_auto_state_v1';
  const STORAGE_KEY_SAVES = 'vb_lineup_saved_states_v1';
  const STORAGE_KEY_OPPONENTS = 'vb_opponents_v1';

  // Rally-points on court that clear the 25%-of-match playing requirement.
  // A hard-fought 3-set match is about 150 rallies (three sets at 26-24);
  // 25% of that is 37.5, so 38 clears the requirement for any match up to
  // that length. It is a deliberate ceiling, and the coach can change it.
  const DEFAULT_PLAYING_TIME_TARGET = 38;

  // --------- State management ---------

  function createInitialState() {
    return {
      players: [],          // [{id, name, points}]
      rotation: [],         // [playerId at pos1, pos2, ..., pos6]
      bench: [],            // [playerId,...]
      setParticipants: [],  // [playerId,...] everyone who has been on court this set
      playingTimeTarget: DEFAULT_PLAYING_TIME_TARGET, // rally-points that clear 25%
      ourScore: 0,
      theirScore: 0,
      serving: 'us',        // 'us' | 'them'
      setNumber: 1,
      theirRun: 0,                        // their points since our last one
      timeoutsUsed: { us: 0, them: 0 },   // this set
      swapAt: null,                       // normalized to the default on render
      stripEnabled: true,
      stripDismissedSet: null,            // set number the strip was dismissed for
      subMode: false,
      pendingSub: null,     // {group: 'court'|'bench', playerId}
      substitutions: [],    // game log: subs + set-end entries
      nextPlayerId: 1,
      opponent: createEmptyOpponent()
    };
  }

  // Opponent data is about other people's kids: jersey numbers, team name,
  // dates and counts only. Never a name field for an opposing player, and
  // nothing leaves this device.
  // Slots are positions first and jerseys second. The six rotation slots exist
  // as soon as they serve, whether or not anyone knows the numbers, so points
  // are attributed to the slot index. A jersey is an optional label on a slot,
  // which is why filling one in later back-fills everything already recorded
  // against that slot.
  function createEmptyOpponent() {
    return {
      name: '',                                   // team name, not a person
      order: [null, null, null, null, null, null], // optional jersey per slot
      serverIdx: null,                            // slot currently serving
      conceded: {},                               // slot index -> points this set
      run: 0                                      // their straight points, this serve
    };
  }

  let state = createInitialState();
  let historyStack = [];

  function cloneState(s) {
    return JSON.parse(JSON.stringify(s));
  }

  function pushHistory() {
    historyStack.push(cloneState(state));
    updateUndoButton();
  }

  function restoreState(snapshot) {
    state = snapshot;
    render();
  }

  function updateUndoButton() {
    const undoBtn = document.getElementById('undo-btn');
    undoBtn.disabled = historyStack.length === 0;
  }

  // --------- Local storage helpers ---------

  function saveAutoState() {
    try {
      localStorage.setItem(STORAGE_KEY_AUTO, JSON.stringify(state));
    } catch (e) {
      // ignore storage errors
    }
  }

  function loadAutoStateIfAny() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_AUTO);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          state = parsed;
        }
      }
    } catch (e) {
      state = createInitialState();
    }
  }

  function getSavedGames() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_SAVES);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function setSavedGames(list) {
    try {
      localStorage.setItem(STORAGE_KEY_SAVES, JSON.stringify(list));
    } catch (e) {
      // ignore
    }
  }

  function refreshSavedGamesDropdown() {
    const sel = document.getElementById('saved-games-select');
    const loadBtn = document.getElementById('load-game-btn');
    const delBtn = document.getElementById('delete-game-btn');
    if (!sel) return;

    const saves = getSavedGames();
    sel.innerHTML = '';

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = saves.length ? 'Select saved game…' : 'No saved games';
    sel.appendChild(placeholder);

    saves.forEach(entry => {
      const opt = document.createElement('option');
      opt.value = String(entry.id);
      const dateStr = new Date(entry.timestamp).toLocaleString();
      opt.textContent = `${entry.name} (${dateStr})`;
      sel.appendChild(opt);
    });

    const hasSaves = saves.length > 0;
    sel.disabled = !hasSaves;
    loadBtn.disabled = !hasSaves;
    delBtn.disabled = !hasSaves;
  }

  // --------- Helpers ---------

  // --------- Rally log ---------
  // One record per point:
  //   { set, ourScore, theirScore, serving, winner, ourRotation, ourServerId,
  //     theirSlot, theirJersey, serveMiss, t, setElapsedMs, matchElapsedMs,
  //     pWin, pace }
  // Scores are the scoreline after the point. serving/ourRotation/ourServerId
  // describe the rally as it was played, which is why the record is built
  // before scorePoint mutates anything.
  //
  // The array is created on demand rather than in createInitialState, so a
  // state saved before this existed starts logging on its next point.

  const PACE_MIN_TOTAL = 8;     // total points before a projection means much
  const SET_TARGET = 25;

  function rallyLog() {
    if (!Array.isArray(state.rallies)) state.rallies = [];
    return state.rallies;
  }

  function lastRally() {
    const log = rallyLog();
    return log.length ? log[log.length - 1] : null;
  }

  // "7 Maya T" -> jersey 7, name "Maya T". "2Fast" has no separator, so it
  // is a name. A bare number is a name too: there is nobody to attach it to.
  function parseLineupLine(line) {
    const m = /^(\d{1,3})\s+(\S.*)$/.exec(String(line).trim());
    if (!m) return { jersey: null, name: String(line).trim() };
    return { jersey: m[1], name: m[2].trim() };
  }

  function playerRef(id) {
    const p = getPlayerById(id);
    if (!p) return null;
    return p.jersey ? String(p.jersey) : ('id:' + id);
  }

  // --------- Serving tiers and the structural set chance ---------
  // The model is ported from volleyball-assistant/lineup.py: shrink(),
  // expected_serve_points(), and its solid/rough/guess thresholds. The
  // numbers below are that file's, not new ones.

  // The coach's stated prior about practice serving, not the app's judgment
  // about a player. Each tier is a starting serve-in rate and how many
  // serves of real data it takes to talk the model out of it.
  const SERVE_TIERS = {
    gold:   { rate: 0.90, weight: 20 },   // strong
    silver: { rate: 0.75, weight: 12 },   // variable
    bronze: { rate: 0.55, weight: 8 }     // unpredictable
  };
  const TIER_CYCLE = ['gold', 'silver', 'bronze'];
  const DEFAULT_TIER = 'silver';

  const MAX_SERVE_RATE = 0.92;   // lineup.py: nobody at this age serves better
  const SERVE_CAP_POINTS = 5;    // lineup.py, CYC 12.4.8 / 12.4.9
  const TEAM_RATE_PRIOR = 20;    // weight behind both team-level rates
  const Q_WIN_RALLY_PRIOR = 0.5; // P(win the rally | our serve landed)

  // Prior for P(we win the rally when they serve). It is NOT 0.5: our own
  // serve is worth silver-rate x Q_WIN_RALLY_PRIOR = 0.375, so pairing that
  // with a flat 0.5 here would assume the opposing team never misses a serve
  // while we miss a quarter of ours, and a default roster would read as a 17%
  // underdog before a ball is struck. Mirroring our own model instead makes
  // an unknown team exactly even at 0-0, which is the honest starting point.
  // Real rallies outweigh this within a set anyway.
  function sideoutPrior() {
    return 1 - Math.min(SERVE_TIERS[DEFAULT_TIER].rate, MAX_SERVE_RATE) * Q_WIN_RALLY_PRIOR;
  }
  const CONF_SOLID = 40;         // lineup.py serve_confidence thresholds
  const CONF_ROUGH = 15;
  const SET_CHANCE_SIMS = 2000;
  const SIM_RALLY_GUARD = 600;   // a set cannot really run this long

  // lineup.py shrink(): pull an observed rate toward a prior, weighted by
  // sample size. No attempts means you get the prior back.
  function shrink(made, attempts, priorRate, priorWeight) {
    if (!(attempts > 0)) return priorRate;
    return (made + priorWeight * priorRate) / (attempts + priorWeight);
  }

  // lineup.py expected_serve_points(): the server has to land it and the team
  // has to win the rally. Uncapped that sum is r/(1-r); under a cap it simply
  // stops at k = cap, which is why a capped division values a big server less.
  function expectedServePoints(pIn, q, cap) {
    const r = Math.min(pIn, MAX_SERVE_RATE) * q;
    if (!(r > 0)) return 0;
    if (cap === null || cap === undefined) return r < 1 ? r / (1 - r) : Infinity;
    let total = 0;
    for (let k = 1; k <= cap; k++) total += Math.pow(r, k);
    return total;
  }

  function serveConfidence(attempts) {
    if (attempts >= CONF_SOLID) return 'solid';
    if (attempts >= CONF_ROUGH) return 'rough';
    return 'guess';
  }

  function tierOf(player) {
    if (player && SERVE_TIERS[player.tier]) return player.tier;
    return DEFAULT_TIER;
  }

  function getServeCap() {
    return state.serveCap === SERVE_CAP_POINTS ? SERVE_CAP_POINTS : null;
  }

  function setServeCap(raw) {
    const cap = (String(raw) === String(SERVE_CAP_POINTS)) ? SERVE_CAP_POINTS : null;
    if (cap === getServeCap()) return;
    pushHistory();
    state.serveCap = cap;
    render();
  }

  function cycleServeTier(playerId) {
    const player = getPlayerById(playerId);
    if (!player) return;
    pushHistory();
    const next = (TIER_CYCLE.indexOf(tierOf(player)) + 1) % TIER_CYCLE.length;
    player.tier = TIER_CYCLE[next];
    render();
  }

  // Every rally we served is one serve by ourServerId; serveMiss marks a miss.
  // Rallies they served give the sideout rate. Their own serve-in rate is not
  // tracked, so it is folded into the sideout number rather than modelled.
  function serveStatsFromLog() {
    const perPlayer = {};
    let teamIn = 0, teamWonAfterIn = 0, theirServes = 0, sideouts = 0;

    rallyLog().forEach(r => {
      if (r.serving === 'us') {
        const id = r.ourServerId;
        if (id) {
          if (!perPlayer[id]) perPlayer[id] = { attempts: 0, in: 0 };
          perPlayer[id].attempts += 1;
          if (!r.serveMiss) perPlayer[id].in += 1;
        }
        if (!r.serveMiss) {
          teamIn += 1;
          if (r.winner === 'us') teamWonAfterIn += 1;
        }
      } else if (r.serving === 'them') {
        theirServes += 1;
        if (r.winner === 'us') sideouts += 1;
      }
    });

    return {
      perPlayer: perPlayer,
      qWinRallyGivenIn: shrink(teamWonAfterIn, teamIn, Q_WIN_RALLY_PRIOR, TEAM_RATE_PRIOR),
      pSideout: shrink(sideouts, theirServes, sideoutPrior(), TEAM_RATE_PRIOR)
    };
  }

  function serveRatingFor(playerId, stats) {
    const player = getPlayerById(playerId);
    const tier = SERVE_TIERS[tierOf(player)];
    const seen = (stats.perPlayer && stats.perPlayer[playerId]) || { attempts: 0, in: 0 };
    const pIn = shrink(seen.in, seen.attempts, tier.rate, tier.weight);
    return {
      id: playerId,
      tier: tierOf(player),
      attempts: seen.attempts,
      pIn: pIn,
      r: Math.min(pIn, MAX_SERVE_RATE) * stats.qWinRallyGivenIn,
      expectedPoints: expectedServePoints(pIn, stats.qWinRallyGivenIn, getServeCap()),
      confidence: serveConfidence(seen.attempts)
    };
  }

  // Position 1 serves next if we have the ball; otherwise the rotation turns
  // once on the sideout and position 2 is up.
  function upcomingServerIds() {
    const rotation = state.rotation.filter(id => id);
    if (!rotation.length) return [];
    const start = state.serving === 'us' ? 0 : 1;
    const out = [];
    for (let k = 0; k < 3 && k < rotation.length; k++) {
      out.push(rotation[(start + k) % rotation.length]);
    }
    return out;
  }

  // Plays the rest of the set out, rally by rally: our serve uses that
  // server's r, their serve uses the sideout rate. Their serve is assumed to
  // land every time, because nothing in the log measures it.
  function simulateSetChance(rng, start) {
    const random = rng || Math.random;
    const from = start || {};
    const stats = serveStatsFromLog();
    const cap = getServeCap();
    const rotation = (from.rotation || state.rotation).filter(id => id);
    const rValues = rotation.length
      ? rotation.map(id => serveRatingFor(id, stats).r)
      : [Math.min(SERVE_TIERS[DEFAULT_TIER].rate, MAX_SERVE_RATE) * stats.qWinRallyGivenIn];
    const pSideout = stats.pSideout;
    const startOur = from.ourScore === undefined ? state.ourScore : from.ourScore;
    const startThem = from.theirScore === undefined ? state.theirScore : from.theirScore;
    const startServing = from.serving || state.serving;

    function decided(a, b) {
      return (a >= SET_TARGET && a - b >= 2) || (b >= SET_TARGET && b - a >= 2);
    }

    let wins = 0;
    for (let sim = 0; sim < SET_CHANCE_SIMS; sim++) {
      let our = startOur, them = startThem;
      let serving = startServing;
      let offset = 0, ourRun = 0, theirRun = 0, guard = 0;

      while (!decided(our, them) && guard++ < SIM_RALLY_GUARD) {
        if (serving === 'us') {
          if (random() < rValues[offset % rValues.length]) {
            our += 1; ourRun += 1;
            if (cap && ourRun >= cap) { serving = 'them'; ourRun = 0; theirRun = 0; }
          } else {
            them += 1; serving = 'them'; ourRun = 0; theirRun = 0;
          }
        } else {
          if (random() < pSideout) {
            our += 1; serving = 'us'; offset = (offset + 1) % rValues.length;
            ourRun = 0; theirRun = 0;
          } else {
            them += 1; theirRun += 1;
            if (cap && theirRun >= cap) {
              serving = 'us'; offset = (offset + 1) % rValues.length;
              ourRun = 0; theirRun = 0;
            }
          }
        }
      }
      if (our > them) wins += 1;
    }
    return wins / SET_CHANCE_SIMS;
  }

  function setChance(start) {
    return simulateSetChance(undefined, start);
  }

  // Straight-line projection: the leader reaches 25, the other side scales.
  function paceFrom(our, them) {
    if (our + them < PACE_MIN_TOTAL) return null;
    if (our === them) return [SET_TARGET, SET_TARGET];
    if (them > our) return [Math.round(our * SET_TARGET / them), SET_TARGET];
    return [SET_TARGET, Math.round(them * SET_TARGET / our)];
  }

  function chanceLabel(pointsPlayed) {
    if (pointsPlayed < 10) return 'early';
    if (pointsPlayed < 20) return 'rough';
    return 'solid';
  }

  function firstRallyTimeInSet(setNumber) {
    const log = rallyLog();
    for (let i = 0; i < log.length; i++) {
      if (log[i].set === setNumber) return log[i].t;
    }
    return null;
  }

  function firstRallyTimeInMatch() {
    const log = rallyLog();
    return log.length ? log[0].t : null;
  }

  // Called from the top of scorePoint, before anything is mutated.
  function recordRally(team, now) {
    const log = rallyLog();
    const t = (typeof now === 'number') ? now : Date.now();
    const ourScore = state.ourScore + (team === 'us' ? 1 : 0);
    const theirScore = state.theirScore + (team === 'them' ? 1 : 0);
    const servingNow = state.serving;

    // Only present once the opponent tracker (its own change) is on the page.
    let theirSlot = null;
    let theirJersey = null;
    const opponent = state.opponent;
    if (opponent && Array.isArray(opponent.order) && typeof opponent.serverIdx === 'number') {
      theirSlot = opponent.serverIdx;
      theirJersey = opponent.order[opponent.serverIdx] || null;
    }

    const setStart = firstRallyTimeInSet(state.setNumber);
    const matchStart = firstRallyTimeInMatch();

    log.push({
      set: state.setNumber,
      ourScore: ourScore,
      theirScore: theirScore,
      serving: servingNow,
      winner: team,
      ourRotation: state.rotation.slice(),
      // Who was at position 1, resolved now. Loading a lineup renumbers player
      // ids, so looking this up later would name the wrong player; a jersey
      // captured at the time survives that.
      ourRotationRef: state.rotation[0] ? playerRef(state.rotation[0]) : null,
      ourServerId: servingNow === 'us' ? (state.rotation[0] || null) : null,
      theirSlot: theirSlot,
      theirJersey: theirJersey,
      serveMiss: false,
      t: t,
      setElapsedMs: setStart === null ? 0 : t - setStart,
      matchElapsedMs: matchStart === null ? 0 : t - matchStart,
      // Chance from the position this point leaves us in, which is why the
      // rotation and serve are projected forward here rather than read back.
      pWin: setChance({
        ourScore: ourScore,
        theirScore: theirScore,
        serving: team,
        rotation: (team === 'us' && servingNow === 'them')
          ? state.rotation.slice(1).concat([state.rotation[0]])
          : state.rotation.slice()
      }),
      pace: paceFrom(ourScore, theirScore)
    });
  }

  // Offered only for the point that just happened, and only when they scored
  // off our serve - the one case where a service error is possible.
  function serveMissAvailable() {
    const last = lastRally();
    return !!(last && last.winner === 'them' && last.serving === 'us');
  }

  function toggleServeMiss() {
    if (!serveMissAvailable()) return;
    pushHistory();
    const last = lastRally();
    last.serveMiss = !last.serveMiss;
    render();
  }

  function toggleSetChance() {
    pushHistory();
    state.showSetChance = !state.showSetChance;
    render();
  }

  function formatClock(ms) {
    if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) ms = 0;
    const total = Math.floor(ms / 1000);
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    const mm = hours ? String(minutes).padStart(2, '0') : String(minutes);
    const ss = String(seconds).padStart(2, '0');
    return hours ? `${hours}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  // Points on court per player, straight from the log, so exact playing-time
  // share is computable without trusting a running counter.
  function pointsOnCourtFromLog() {
    const totals = {};
    rallyLog().forEach(r => {
      (r.ourRotation || []).forEach(id => {
        if (!id) return;
        totals[id] = (totals[id] || 0) + 1;
      });
    });
    return totals;
  }

  // Jersey numbers and counts. Never a name: the log is the one thing here
  // built to leave the device.
  function buildRallyExport(now) {
    const log = rallyLog();
    const totals = pointsOnCourtFromLog();
    const serveStats = serveStatsFromLog();
    return {
      exportedAt: new Date(typeof now === 'number' ? now : Date.now()).toISOString(),
      totalRallies: log.length,
      sets: log.length ? log[log.length - 1].set : 0,
      players: state.players.map(p => {
        const seen = serveStats.perPlayer[p.id] || { attempts: 0, in: 0 };
        return {
          ref: p.jersey ? String(p.jersey) : ('id:' + p.id),
          tier: tierOf(p),                 // a category, never an identity
          pointsOnCourt: totals[p.id] || 0,
          serveAttempts: seen.attempts,
          servesIn: seen.in
        };
      }),
      rallies: log.map(r => ({
        set: r.set,
        ourScore: r.ourScore,
        theirScore: r.theirScore,
        serving: r.serving,
        winner: r.winner,
        ourRotation: (r.ourRotation || []).map(id => playerRef(id)),
        ourServer: r.ourServerId ? playerRef(r.ourServerId) : null,
        theirSlot: r.theirSlot,
        theirJersey: r.theirJersey,
        serveMiss: !!r.serveMiss,
        t: r.t,
        setElapsedMs: r.setElapsedMs,
        matchElapsedMs: r.matchElapsedMs,
        pWin: r.pWin,
        pace: r.pace
      }))
    };
  }

  function exportRallyLog() {
    const data = JSON.stringify(buildRallyExport(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rally-log-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // --------- Their servers x our receiving rotations ---------
  // Built entirely from the rally log. Their slot comes from the opponent
  // tracker when that change is on the page; without it every serve lands in
  // one unlabelled row and the grid still reports our rotations.

  // A rotation is named by whoever is at position 1, which survives a lineup
  // change between sets in a way that "rotation 4" does not. The stored form
  // is a jersey or an internal id, never a display name.
  // UI-only: which panel is open. Not state, so it stays off the undo stack.
  let gridPanelOpen = false;
  let reviewPanelOpen = false;

  function rotationKeyOf(record) {
    if (record.ourRotationRef) return record.ourRotationRef;
    const id = record.ourRotation && record.ourRotation[0];
    return id ? (playerRef(id) || ('id:' + id)) : 'unknown';
  }

  function rotationDisplayOf(record) {
    const key = rotationKeyOf(record);
    if (key === 'unknown') return key;
    // A jersey reads as itself. An unnumbered player is only recoverable by
    // id, which a lineup reload may have handed to somebody else, so that
    // case falls back to whatever the id names now.
    if (key.indexOf('id:') !== 0) return '#' + key;
    const player = getPlayerById(parseInt(key.slice(3), 10));
    return player ? player.name : key;
  }

  // Row label straight off the record, so it stays right even if their order
  // is edited later.
  function slotLabelOf(record) {
    if (record.theirJersey) return '#' + record.theirJersey;
    if (typeof record.theirSlot === 'number') return '#? (position ' + (record.theirSlot + 1) + ')';
    return 'their serve';
  }

  function slotKeyOf(record) {
    return (typeof record.theirSlot === 'number') ? ('slot' + record.theirSlot) : 'unknown';
  }

  // A service turn is a run of consecutive rallies they served, which is also
  // exactly one receive turn for whichever rotation we were in. Runs stop at a
  // set boundary.
  function serviceTurns() {
    const log = rallyLog();
    const turns = [];
    let i = 0;
    while (i < log.length) {
      if (log[i].serving !== 'them') { i++; continue; }
      let j = i;
      while (j < log.length && log[j].serving === 'them' && log[j].set === log[i].set) j++;
      const run = log.slice(i, j);
      turns.push({
        set: run[0].set,
        slotKey: slotKeyOf(run[0]),
        slotLabel: slotLabelOf(run[0]),
        rotationKey: rotationKeyOf(run[0]),
        rotationDisplay: rotationDisplayOf(run[0]),
        rotationIndex: null,
        rallies: run.length,
        conceded: run.filter(r => r.winner === 'them').length,
        sideouts: run.filter(r => r.winner === 'us').length
      });
      i = j;
    }
    return turns;
  }

  // R1..R6 relative to the lineup the set started with. A player subbed into
  // position 1 mid-set is not in that lineup, so the index is simply dropped
  // and the position-1 label carries the identity.
  function rotationIndexFor(setNumber, record) {
    const log = rallyLog();
    let start = null;
    for (let i = 0; i < log.length; i++) {
      if (log[i].set === setNumber) { start = log[i].ourRotation || []; break; }
    }
    const id = record.ourRotation && record.ourRotation[0];
    if (!start || !id) return null;
    const at = start.indexOf(id);
    return at === -1 ? null : (at + 1);
  }

  function buildServerGrid() {
    const log = rallyLog();
    const turns = serviceTurns();
    turns.forEach(t => {
      const first = log.find(r => r.set === t.set && r.serving === 'them' &&
        rotationKeyOf(r) === t.rotationKey);
      t.rotationIndex = first ? rotationIndexFor(t.set, first) : null;
    });

    const rows = {};      // their slot
    const cols = {};      // our rotation
    const cells = {};     // slot|rotation

    turns.forEach(t => {
      if (!rows[t.slotKey]) {
        rows[t.slotKey] = { key: t.slotKey, label: t.slotLabel, points: 0, turns: 0, rotations: {} };
      }
      const row = rows[t.slotKey];
      row.points += t.conceded;
      row.turns += 1;
      row.rotations[t.rotationKey] = true;

      if (!cols[t.rotationKey]) {
        cols[t.rotationKey] = {
          key: t.rotationKey, label: t.rotationDisplay,
          index: t.rotationIndex, conceded: 0, turns: 0
        };
      }
      const col = cols[t.rotationKey];
      if (col.index === null) col.index = t.rotationIndex;
      col.conceded += t.conceded;
      col.turns += 1;

      const cellKey = t.slotKey + '|' + t.rotationKey;
      if (!cells[cellKey]) cells[cellKey] = { conceded: 0, sideouts: 0, rallies: 0 };
      cells[cellKey].conceded += t.conceded;
      cells[cellKey].sideouts += t.sideouts;
      cells[cellKey].rallies += t.rallies;
    });

    const rowList = Object.keys(rows).map(k => rows[k])
      .sort((a, b) => b.points - a.points || a.label.localeCompare(b.label));
    const colList = Object.keys(cols).map(k => cols[k])
      .sort((a, b) => (a.index || 99) - (b.index || 99) || a.label.localeCompare(b.label));

    return { turns: turns, rows: rowList, cols: colList, cells: cells };
  }

  function columnName(col) {
    return col.index ? ('R' + col.index + ' (' + col.label + ')') : col.label;
  }

  // Counts, stated plainly. Held back until there is enough to state.
  function gridReads(grid) {
    const reads = [];

    const busiest = grid.rows.filter(r => r.turns >= 2)
      .sort((a, b) => b.points - a.points)[0];
    if (busiest) {
      const hit = Object.keys(busiest.rotations);
      let against = '';
      if (hit.length === 1) {
        const col = grid.cols.filter(c => c.key === hit[0])[0];
        const name = col ? columnName(col) : hit[0];
        against = busiest.turns === 2 ? `, both against ${name}` : `, all ${busiest.turns} against ${name}`;
      } else {
        against = `, across ${hit.length} of our rotations`;
      }
      reads.push(`Their ${busiest.label}: ${busiest.points} points on ` +
        `${busiest.turns} service turns${against}.`);
    }

    const received = grid.cols.filter(c => c.turns > 0);
    if (received.length >= 2) {
      const worst = received.slice().sort((a, b) => b.conceded - a.conceded)[0];
      const tied = received.filter(c => c.conceded === worst.conceded).length > 1;
      reads.push(`${columnName(worst)}: ${worst.conceded} points conceded on ` +
        `${worst.turns} receive turns${tied ? '' : ', most of any rotation'}.`);
    }

    return reads;
  }

  // --------- Post-match review ---------

  // Straight off the records: the chance as it stood at each five-point mark,
  // so the number can be judged after the fact rather than during.
  function reviewMarksForSet(setNumber) {
    const log = rallyLog().filter(r => r.set === setNumber);
    if (!log.length) return null;
    const marks = [];
    const seen = {};
    log.forEach((r, i) => {
      const combined = r.ourScore + r.theirScore;
      const isLast = i === log.length - 1;
      if (i === 0 || combined % 5 === 0 || isLast) {
        const key = r.ourScore + '-' + r.theirScore;
        if (seen[key]) return;
        seen[key] = true;
        marks.push({
          score: key,
          pWin: typeof r.pWin === 'number' ? r.pWin : null,
          final: isLast
        });
      }
    });
    return { set: setNumber, marks: marks };
  }

  function reviewSets() {
    const sets = [];
    rallyLog().forEach(r => { if (sets.indexOf(r.set) === -1) sets.push(r.set); });
    return sets.sort((a, b) => a - b).map(reviewMarksForSet).filter(Boolean);
  }

  // --------- Optional: hand the grid to the opponent library ---------
  // The opponent library is a separate change. When it is on the page it
  // files one record per set; this adds the grid to that record. Wrapping its
  // function rather than editing it keeps the two changes independent and
  // mergeable in either order, and when it is absent none of this runs.

  function gridRecordForSet(setNumber) {
    const byCell = {};
    serviceTurns().filter(t => t.set === setNumber).forEach(t => {
      // Keys are a slot index and a jersey or internal id. Never a name.
      const key = t.slotKey + '|' + t.rotationKey;
      if (!byCell[key]) byCell[key] = { conceded: 0, sideouts: 0, rallies: 0, turns: 0 };
      byCell[key].conceded += t.conceded;
      byCell[key].sideouts += t.sideouts;
      byCell[key].rallies += t.rallies;
      byCell[key].turns += 1;
    });
    return byCell;
  }

  function attachGridToOpponentRecord(setNumber) {
    if (typeof getOpponentLibrary !== 'function' || typeof setOpponentLibrary !== 'function') return;
    const opponent = state.opponent;
    if (!opponent || !opponent.name) return;
    const grid = gridRecordForSet(setNumber);
    if (!Object.keys(grid).length) return;

    const library = getOpponentLibrary();
    const entry = library[opponent.name];
    if (!entry || !Array.isArray(entry.sets)) return;
    for (let i = entry.sets.length - 1; i >= 0; i--) {
      if (entry.sets[i] && entry.sets[i].setNumber === setNumber) {
        entry.sets[i].grid = grid;
        setOpponentLibrary(library);
        return;
      }
    }
  }

  function integrateWithOpponentLibrary() {
    if (typeof recordCurrentOpponentSet !== 'function') return;
    if (recordCurrentOpponentSet.gridWrapped) return;
    const original = recordCurrentOpponentSet;
    const wrapped = function () {
      const setNumber = state.setNumber;
      const wrote = original.apply(null, arguments);
      if (wrote) attachGridToOpponentRecord(setNumber);
      return wrote;
    };
    wrapped.gridWrapped = true;
    try {
      recordCurrentOpponentSet = wrapped;
    } catch (e) {
      // If the binding cannot be replaced the grid simply is not filed.
    }
  }

  function renderGridPanel() {
    const panel = document.getElementById('grid-panel');
    panel.hidden = !gridPanelOpen;
    panel.innerHTML = '';
    if (!gridPanelOpen) return;

    const grid = buildServerGrid();
    if (!grid.turns.length) {
      const empty = document.createElement('div');
      empty.className = 'small-label';
      empty.textContent = 'No receiving rallies logged yet.';
      panel.appendChild(empty);
      return;
    }

    gridReads(grid).forEach(text => {
      const line = document.createElement('div');
      line.className = 'grid-read';
      line.textContent = text;
      panel.appendChild(line);
    });

    const table = document.createElement('table');
    table.className = 'grid';

    const head = document.createElement('tr');
    const corner = document.createElement('th');
    corner.textContent = 'conceded / sideouts';
    head.appendChild(corner);
    grid.cols.forEach(col => {
      const th = document.createElement('th');
      th.textContent = columnName(col);
      head.appendChild(th);
    });
    const rowTotalHead = document.createElement('th');
    rowTotalHead.textContent = 'turns';
    head.appendChild(rowTotalHead);
    table.appendChild(head);

    grid.rows.forEach(row => {
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.textContent = row.label;
      tr.appendChild(th);
      grid.cols.forEach(col => {
        const td = document.createElement('td');
        const cell = grid.cells[row.key + '|' + col.key];
        if (cell) {
          td.textContent = cell.conceded + ' / ' + cell.sideouts;
          td.title = cell.rallies + ' receive rallies';
        } else {
          td.className = 'empty';
          td.textContent = '–';
        }
        tr.appendChild(td);
      });
      const turnsCell = document.createElement('td');
      turnsCell.textContent = row.points + ' on ' + row.turns;
      tr.appendChild(turnsCell);
      table.appendChild(tr);
    });

    const foot = document.createElement('tr');
    const footLabel = document.createElement('th');
    footLabel.textContent = 'receive turns';
    foot.appendChild(footLabel);
    grid.cols.forEach(col => {
      const td = document.createElement('td');
      td.textContent = col.conceded + ' on ' + col.turns;
      foot.appendChild(td);
    });
    foot.appendChild(document.createElement('td'));
    table.appendChild(foot);

    panel.appendChild(table);
  }

  function renderReviewPanel() {
    const panel = document.getElementById('review-panel');
    panel.hidden = !reviewPanelOpen;
    panel.innerHTML = '';
    if (!reviewPanelOpen) return;

    const sets = reviewSets();
    if (!sets.length) {
      const empty = document.createElement('div');
      empty.className = 'small-label';
      empty.textContent = 'No rallies logged yet.';
      panel.appendChild(empty);
      return;
    }

    sets.forEach(entry => {
      const line = document.createElement('div');
      line.className = 'review-set';
      const parts = entry.marks.map(m => m.final
        ? ('final ' + m.score)
        : (m.score + ' ' + (m.pWin === null ? '--' : Math.round(m.pWin * 100) + '%')));
      line.textContent = `Set ${entry.set}: ` + parts.join(' · ');
      panel.appendChild(line);
    });

    const shares = playingTimeShares();
    const rallies = rallyLog().length;
    const header = document.createElement('div');
    header.className = 'small-label review-players';
    header.textContent = `Points on court, of ${rallies} rallies this match:`;
    panel.appendChild(header);

    shares.forEach(s => {
      const line = document.createElement('div');
      line.className = 'review-player';
      const who = s.jersey ? ('#' + s.jersey + ' ' + s.name) : s.name;
      line.textContent = `${who}: ${s.points} (${Math.round(s.share * 100)}%)`;
      panel.appendChild(line);
    });
  }

  // The exact playing-time share, straight from the log.
  function playingTimeShares() {
    const totals = pointsOnCourtFromLog();
    const rallies = rallyLog().length;
    return state.players.map(p => ({
      id: p.id,
      name: p.name,
      jersey: p.jersey || null,
      points: totals[p.id] || 0,
      share: rallies ? (totals[p.id] || 0) / rallies : 0
    })).sort((a, b) => b.points - a.points);
  }

  function getPlayerById(id) {
    return state.players.find(p => p.id === id) || null;
  }

  function getPlayerName(id) {
    const p = getPlayerById(id);
    return p ? p.name : '';
  }

  function incrementPointsForOnCourtPlayers() {
    state.rotation.forEach(id => {
      if (!id) return;
      const p = getPlayerById(id);
      if (p) p.points += 1;
    });
  }

  // --------- Set participation (CYC Rule 20.1) ---------

  // setParticipants is everyone who has been on court at any point in the
  // current set. Called at the top of render(), so it picks up subs and any
  // other change that puts a new id in the rotation. Older saved states have
  // no record of who has already played, so they default to the six on court.
  function syncSetParticipants() {
    if (!Array.isArray(state.setParticipants)) {
      state.setParticipants = [];
    }
    state.rotation.forEach(id => {
      if (id && state.setParticipants.indexOf(id) === -1) {
        state.setParticipants.push(id);
      }
    });
  }

  function benchPlayersNotYetIn() {
    const played = Array.isArray(state.setParticipants) ? state.setParticipants : [];
    return state.bench.filter(id => id && played.indexOf(id) === -1);
  }

  // --------- 25% playing-time target ---------

  // Saved states written before this existed have no target, so fall back to
  // the default rather than showing "/ undefined".
  function getPlayingTimeTarget() {
    const t = state.playingTimeTarget;
    if (typeof t === 'number' && isFinite(t) && t >= 0) return t;
    return DEFAULT_PLAYING_TIME_TARGET;
  }

  function playersBelowTarget() {
    const target = getPlayingTimeTarget();
    return state.players.filter(p => p.points < target);
  }

  function setPlayingTimeTarget(raw) {
    const parsed = parseInt(raw, 10);
    if (isNaN(parsed) || parsed < 0) {
      render();  // put the input back to the value actually in use
      return;
    }
    if (parsed === getPlayingTimeTarget()) return;
    pushHistory();
    state.playingTimeTarget = parsed;
    render();
  }

  // rotation index 0..5 => positions 1..6
  function getPlayerIdAtPosition(posNumber) {
    const idx = posNumber - 1;
    return state.rotation[idx];
  }

  // --------- Run, timeouts and the swap window ---------
  // Everything here reports counts and arithmetic. No advice: what to do with
  // a run, a timeout or a swap window is the coach's call.

  const TIMEOUTS_PER_SET = 2;   // Rule 15.1.2
  const DEFAULT_SWAP_AT = 20;   // combined score the coach watches for
  const RUN_STRIP_AT = 4;       // their straight points before the strip shows
  const PACE_MIN_POINTS = 8;    // too few points to project anything from
  const PACE_MARGIN = 12;       // projected margin that swaps timeouts for pace

  // Saved states written before these existed fall back to the defaults
  // rather than rendering blanks.
  function getSwapAt() {
    const n = state.swapAt;
    if (typeof n === 'number' && isFinite(n) && n >= 1) return Math.floor(n);
    return DEFAULT_SWAP_AT;
  }

  function timeoutsLeft(team) {
    const used = state.timeoutsUsed && typeof state.timeoutsUsed[team] === 'number'
      ? state.timeoutsUsed[team] : 0;
    return Math.max(0, TIMEOUTS_PER_SET - used);
  }

  function takeTimeout(team) {
    if (timeoutsLeft(team) <= 0) return;
    pushHistory();
    if (!state.timeoutsUsed || typeof state.timeoutsUsed !== 'object') {
      state.timeoutsUsed = { us: 0, them: 0 };
    }
    state.timeoutsUsed[team] = (state.timeoutsUsed[team] || 0) + 1;
    state.substitutions.unshift({
      kind: 'timeout',
      team: team,
      remaining: timeoutsLeft(team),
      setNumber: state.setNumber,
      score: state.ourScore + "-" + state.theirScore
    });
    render();
  }

  // Their consecutive points since our last one. Any point of ours ends it.
  function updateTheirRun(team) {
    if (typeof state.theirRun !== 'number' || !isFinite(state.theirRun)) state.theirRun = 0;
    state.theirRun = (team === 'them') ? state.theirRun + 1 : 0;
  }

  // Projects the set from the current ratio: the leader reaches 25 and the
  // other side scales. Nothing to project from below PACE_MIN_POINTS.
  function paceProjection() {
    const us = state.ourScore;
    const them = state.theirScore;
    if (them < PACE_MIN_POINTS) return null;
    if (us === them) return { us: 25, them: 25, margin: 0 };
    let projUs, projThem;
    if (them > us) {
      projThem = 25;
      projUs = Math.round(us * 25 / them);
    } else {
      projUs = 25;
      projThem = Math.round(them * 25 / us);
    }
    return { us: projUs, them: projThem, margin: Math.abs(projUs - projThem) };
  }

  // The window rolls: 20, then 40, then 60. It opens at N-2 and closes at
  // N+2, so a server mid-run does not have to be frozen at exactly N.
  function swapWindow() {
    const n = getSwapAt();
    const combined = state.ourScore + state.theirScore;
    const target = n * Math.max(1, Math.ceil((combined - 2) / n));
    const progress = Math.max(0, Math.min(1, (combined - (target - 5)) / 5));
    return {
      n: n,
      combined: combined,
      target: target,
      progress: progress,
      inWindow: combined >= target - 2 && combined <= target + 2
    };
  }

  // Who is serving for us, stated plainly. Names stay on the device.
  function servingFact() {
    if (state.serving !== 'us') return '';
    const id = state.rotation[0];
    const player = id ? getPlayerById(id) : null;
    if (!player) return '';
    return `We're serving (${player.name} at position 1). ` +
           `A swap at position 1 now ends ${player.name}'s serve.`;
  }

  function stripVisible() {
    if (state.stripEnabled === false) return false;
    if (state.stripDismissedSet === state.setNumber) return false;
    return (state.theirRun || 0) >= RUN_STRIP_AT;
  }

  function resetStripForNewSet() {
    state.theirRun = 0;
    state.timeoutsUsed = { us: 0, them: 0 };
    state.stripDismissedSet = null;
  }

  function setSwapAt(raw) {
    const parsed = parseInt(raw, 10);
    if (isNaN(parsed) || parsed < 1) { render(); return; }
    if (parsed === getSwapAt()) return;
    pushHistory();
    state.swapAt = parsed;
    render();
  }

  function toggleStrip() {
    pushHistory();
    state.stripEnabled = (state.stripEnabled === false);
    render();
  }

  function dismissStrip() {
    pushHistory();
    state.stripDismissedSet = state.setNumber;
    render();
  }

  function addStripSpan(strip, text, plain) {
    const span = document.createElement('span');
    if (plain) span.className = 'strip-fact';
    span.textContent = text;
    strip.appendChild(span);
    return span;
  }

  // One line of facts: how long their run is, and either what is left in the
  // timeout bank or where the set is heading. Never what to do about it.
  function renderStrip() {
    document.getElementById('timeout-us-btn').textContent = `Timeout us (${timeoutsLeft('us')})`;
    document.getElementById('timeout-them-btn').textContent = `Timeout them (${timeoutsLeft('them')})`;
    document.getElementById('timeout-us-btn').disabled = timeoutsLeft('us') <= 0;
    document.getElementById('timeout-them-btn').disabled = timeoutsLeft('them') <= 0;

    const toggle = document.getElementById('strip-toggle-btn');
    toggle.textContent = state.stripEnabled === false ? 'Strip: Off' : 'Strip: On';
    toggle.classList.toggle('toggle-on', state.stripEnabled !== false);

    const swapInput = document.getElementById('swap-at-input');
    state.swapAt = getSwapAt();
    if (document.activeElement !== swapInput) swapInput.value = state.swapAt;

    const strip = document.getElementById('run-strip');
    strip.innerHTML = '';
    strip.hidden = !stripVisible();
    if (strip.hidden) return;

    addStripSpan(strip, `Their run: ${state.theirRun} straight.`);

    const pace = paceProjection();
    const window = swapWindow();
    if (pace && pace.margin >= PACE_MARGIN) {
      // Scoreboard order, us first, to match "Us: n  Them: n" above.
      addStripSpan(strip, `Pace ${pace.us}-${pace.them}.`);
      addStripSpan(strip, `Combined ${window.combined}; swap at ${window.target}.`);
    } else {
      addStripSpan(strip, `Timeouts left: ${timeoutsLeft('us')}.`);
    }

    const gauge = document.createElement('span');
    gauge.className = 'swap-gauge';
    const fill = document.createElement('span');
    fill.className = 'swap-gauge-fill';
    fill.style.width = Math.round(window.progress * 100) + '%';
    gauge.appendChild(fill);
    strip.appendChild(gauge);

    if (window.inWindow) addStripSpan(strip, 'In window.');

    const fact = servingFact();
    if (fact) addStripSpan(strip, fact, true);

    const dismiss = document.createElement('span');
    dismiss.className = 'strip-dismiss';
    dismiss.textContent = 'dismiss';
    dismiss.addEventListener('click', dismissStrip);
    strip.appendChild(dismiss);
  }

  // --------- Actions ---------

  function loadLineupFromTextarea() {
    const text = document.getElementById('lineup-input').value;
    const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

    if (rawLines.length === 0) {
      alert("Please enter at least one player name.");
      return;
    }

    pushHistory();

    const oldPlayersByName = {};
    state.players.forEach(p => {
      oldPlayersByName[p.name] = p;
    });

    const newPlayers = [];
    let nextId = 1;

    for (const line of rawLines) {
      const parsed = parseLineupLine(line);
      const name = parsed.name;
      let existing = oldPlayersByName[name];
      if (!existing) {
        existing = {
          id: nextId, name: name, points: 0,
          jersey: parsed.jersey, tier: DEFAULT_TIER
        };
      } else {
        existing = {
          id: nextId,
          name: existing.name,
          points: existing.points,
          // a number typed this time wins; otherwise keep what was there
          jersey: parsed.jersey || existing.jersey || null,
          // the coach's tier is theirs; a lineup reload must not reset it
          tier: existing.tier || DEFAULT_TIER
        };
      }
      newPlayers.push(existing);
      nextId += 1;
    }

    state.players = newPlayers;
    state.nextPlayerId = nextId;

    const ids = newPlayers.map(p => p.id);
    // First six are positions 1..6
    state.rotation = ids.slice(0, 6);
    state.bench = ids.slice(6);

    // Player ids are reassigned here, so participation restarts from the
    // six now on court. playingTimeTarget is deliberately left alone: this
    // button is also how a coach fixes a typo or adds a late arrival
    // mid-match, and silently resetting their target would surprise them.
    state.setParticipants = state.rotation.slice();

    state.pendingSub = null;

    render();
  }

  // Volleyball rotation: 1 -> 6 -> 5 -> 4 -> 3 -> 2 -> 1
  // Internally rotation[0] = pos1, ..., rotation[5] = pos6

  // "Forward" = real volleyball rotation (1 to 6)
  function rotateForward() {
    if (state.rotation.length < 2) return;
    pushHistory();
    // Left-rotate: [p1,p2,p3,p4,p5,p6] -> [p2,p3,p4,p5,p6,p1]
    const first = state.rotation[0];
    state.rotation = state.rotation.slice(1).concat([first]);
    render();
  }

  // "Backward" = reverse of that rotation (6 back to 1)
  function rotateBackward() {
    if (state.rotation.length < 2) return;
    pushHistory();
    // Right-rotate: [p1,p2,p3,p4,p5,p6] -> [p6,p1,p2,p3,p4,p5]
    const last = state.rotation[state.rotation.length - 1];
    state.rotation = [last].concat(state.rotation.slice(0, state.rotation.length - 1));
    render();
  }

  function scorePoint(team) {
    pushHistory();
    // Before any mutation: who was serving, who was on court, which of their
    // slots was up. None of that is recoverable afterwards.
    recordRally(team);

    if (team === 'us') {
      if (state.serving === 'them') {
        // sideout: they served, we win rally -> we get serve & rotate (1 -> 6)
        state.serving = 'us';
        if (state.rotation.length >= 2) {
          const first = state.rotation[0];
          state.rotation = state.rotation.slice(1).concat([first]);
        }
      }
      state.ourScore += 1;
      normalizeOpponent().run = 0;   // any point of ours ends their run
    } else {
      if (state.serving === 'us') {
        // we served, lost rally -> they get serve, no rotation for us.
        // They rotate, so a new jersey comes up to serve. The point that won
        // them the serve was won while receiving, so it is credited to nobody.
        state.serving = 'them';
        advanceOppServer();
      } else {
        // they were already serving: same server, credit the point to them
        creditOppPoint();
      }
      state.theirScore += 1;
    }

    incrementPointsForOnCourtPlayers();
    updateTheirRun(team);
    render();
  }

  function toggleServing() {
    pushHistory();
    state.serving = (state.serving === 'us') ? 'them' : 'us';
    // This is a correction, not a rally, so it never advances their rotation.
    // It does establish slot 0 when the set opens with them serving.
    if (state.serving === 'them' && normalizeOpponent().serverIdx === null) {
      state.opponent.serverIdx = 0;
    }
    render();
  }

  function toggleSubMode() {
    pushHistory();
    state.subMode = !state.subMode;
    state.pendingSub = null;
    render();
  }

  function handlePlayerClick(group, playerId) {
    if (!state.subMode) return;

    const pending = state.pendingSub;
    if (!pending) {
      state.pendingSub = { group, playerId };
      render();
      return;
    }

    if (pending.playerId === playerId || pending.group === group) {
      state.pendingSub = null;
      render();
      return;
    }

    let courtId, benchId;
    if (group === 'court') {
      courtId = playerId;
      benchId = pending.playerId;
    } else {
      courtId = pending.playerId;
      benchId = playerId;
    }

    if (!state.rotation.includes(courtId) || !state.bench.includes(benchId)) {
      state.pendingSub = null;
      render();
      return;
    }

    pushHistory();

    state.rotation = state.rotation.map(id => id === courtId ? benchId : id);
    state.bench = state.bench.map(id => id === benchId ? courtId : id);

    // Log substitution in game log (newest first)
    state.substitutions.unshift({
      kind: 'sub',
      inId: benchId,
      outId: courtId,
      setNumber: state.setNumber,
      score: state.ourScore + "-" + state.theirScore
    });

    state.pendingSub = null;
    render();
  }

  function newSet() {
    // Report what the rulebook cares about: who never entered this set, and
    // who is short of the playing-time target. The coach decides; this never
    // blocks ending the set.
    const paragraphs = [];

    const missing = benchPlayersNotYetIn();
    if (missing.length > 0) {
      const names = missing.map(getPlayerName).join(', ');
      const plural = missing.length === 1 ? 'player who' : 'players who';
      paragraphs.push(
        `Set ${state.setNumber} ended with ${missing.length} ${plural} did not enter: ${names}.`
      );
      paragraphs.push(
        `CYC Rule 20.1: all eligible bench players must participate in each set.`
      );
    }

    const target = getPlayingTimeTarget();
    const below = playersBelowTarget();
    if (below.length > 0) {
      const detail = below
        .map(p => `${p.name} ${p.points} (needs ${target - p.points})`)
        .join(', ');
      paragraphs.push(`Below the 25% target (${target}): ${detail}.`);
    }

    if (paragraphs.length > 0) {
      if (!confirm(paragraphs.join('\n\n') + '\n\nContinue to next set?')) {
        return;
      }
    }

    pushHistory();

    // Log final score of the set we're ending
    state.substitutions.unshift({
      kind: 'setEnd',
      setNumber: state.setNumber,
      score: state.ourScore + "-" + state.theirScore
    });

    // File the set we just played, then carry their order into the next set
    // as a starting guess: teams usually keep the same serving order.
    recordCurrentOpponentSet();
    const opponent = normalizeOpponent();
    if (opponent.order.some(j => j !== null)) {
      opponent.carriedFrom = state.setNumber;
    }
    opponent.conceded = {};
    opponent.serverIdx = null;
    opponent.run = 0;
    editingOppSlot = false;

    // Advance to next set and reset scores
    state.setNumber += 1;
    state.ourScore = 0;
    state.theirScore = 0;
    state.serving = 'us';
    state.setParticipants = state.rotation.filter(id => id);
    state.pendingSub = null;
    resetStripForNewSet();
    render();
  }

  function resetApp() {
    if (!confirm("Reset app? This will clear scores, sets, points, lineup, and substitutions. Saved games will be retained and can be manually deleted.")) {
      return;
    }
    try {
      localStorage.removeItem(STORAGE_KEY_AUTO);
    } catch (e) {}
    state = createInitialState();
    historyStack = [];
    render();
  }

  function undoLast() {
    if (historyStack.length === 0) return;
    const snapshot = historyStack.pop();
    restoreState(snapshot);
  }

  // --------- Saved games actions ---------

  function saveCurrentGameAsSnapshot() {
    const name = prompt("Name this game (e.g., 'vs Panthers Set 2'):");
    if (!name) return;
    const saves = getSavedGames();
    const now = Date.now();
    const entry = {
      id: now,
      name: name,
      timestamp: now,
      state: cloneState(state)
    };
    saves.push(entry);
    setSavedGames(saves);
    // Saving is the closest thing to an end-of-match step, so file the set in
    // progress too. Keyed by date + set number, so ending the set later
    // updates this record rather than adding a second one.
    recordCurrentOpponentSet();
    render();
  }

  function loadSelectedSavedGame() {
    const sel = document.getElementById('saved-games-select');
    if (!sel) return;
    const idStr = sel.value;
    if (!idStr) return;

    const saves = getSavedGames();
    const entry = saves.find(e => String(e.id) === idStr);
    if (!entry) return;

    if (!confirm(`Load "${entry.name}"? Current game state will be replaced.`)) {
      return;
    }

    pushHistory();
    state = cloneState(entry.state);
    render();
  }

  function deleteSelectedSavedGame() {
    const sel = document.getElementById('saved-games-select');
    if (!sel) return;
    const idStr = sel.value;
    if (!idStr) return;

    const saves = getSavedGames();
    const entry = saves.find(e => String(e.id) === idStr);
    if (!entry) return;

    if (!confirm(`Delete saved game "${entry.name}"? This cannot be undone.`)) {
      return;
    }

    const remaining = saves.filter(e => String(e.id) !== idStr);
    setSavedGames(remaining);
    refreshSavedGamesDropdown();
  }

  // --------- Opponent serving rotation ---------

  // UI-only flags. Deliberately not in state: toggling a panel or opening an
  // edit box is not a game event and should not land on the undo stack.
  let opponentsPanelOpen = false;
  let editingOppSlot = false;
  let oppOrderRowOpen = false;

  // Saved states written before this existed have no opponent, and a partly
  // written one should not take the app down courtside.
  function normalizeOpponent() {
    let o = state.opponent;
    if (!o || typeof o !== 'object' || Array.isArray(o)) {
      o = state.opponent = createEmptyOpponent();
    }
    if (typeof o.name !== 'string') o.name = '';
    if (!Array.isArray(o.order) || o.order.length !== 6) {
      const src = Array.isArray(o.order) ? o.order : [];
      o.order = [0, 1, 2, 3, 4, 5].map(i => (src[i] == null ? null : String(src[i])));
    }
    if (typeof o.serverIdx !== 'number' || o.serverIdx < 0 || o.serverIdx > 5) {
      o.serverIdx = null;
    }
    if (!o.conceded || typeof o.conceded !== 'object' || Array.isArray(o.conceded)) {
      o.conceded = {};
    } else {
      // Keys are slot indexes. Drop anything else so a stray key cannot show
      // up as a phantom position.
      Object.keys(o.conceded).forEach(k => {
        const n = Number(k);
        if (!Number.isInteger(n) || n < 0 || n > 5 || typeof o.conceded[k] !== 'number') {
          delete o.conceded[k];
        }
      });
    }
    if (typeof o.run !== 'number' || !isFinite(o.run) || o.run < 0) o.run = 0;
    return o;
  }

  // "#12" once known, "#? (position 3)" until then. Their serving slots are
  // numbered 1-6 in serving order.
  function oppSlotLabel(o, slot) {
    const jersey = o.order[slot];
    return jersey ? ('#' + jersey) : ('#? (position ' + (slot + 1) + ')');
  }

  // Jerseys are numbers. Strip anything else so "#12" and "12" are one key.
  function cleanJersey(raw) {
    const digits = String(raw == null ? '' : raw).replace(/[^0-9]/g, '').slice(0, 3);
    return digits.length ? digits : null;
  }

  function currentOppJersey() {
    const o = normalizeOpponent();
    return o.serverIdx === null ? null : o.order[o.serverIdx];
  }

  function oppOrderComplete() {
    return normalizeOpponent().order.every(j => j !== null);
  }

  // They advance one slot each time they gain serve, which only happens when
  // they win a rally we served. Scoring while already serving does not move
  // them. Whoever serves first, that server is slot 0.
  function advanceOppServer() {
    const o = normalizeOpponent();
    o.serverIdx = (o.serverIdx === null) ? 0 : (o.serverIdx + 1) % 6;
    o.run = 0;  // new server, new run
  }

  // Credited to the slot, so it works whether or not the jersey is known yet.
  function creditOppPoint() {
    const o = normalizeOpponent();
    if (o.serverIdx === null) return;
    const key = String(o.serverIdx);
    o.conceded[key] = (o.conceded[key] || 0) + 1;
    o.run += 1;
  }

  // Their current server has scored this many straight. At 3 the control gets
  // prominent so the number is easy to enter exactly when it starts mattering.
  function oppRunIsNotable() {
    return normalizeOpponent().run >= 3;
  }

  // Labels one slot. Points already recorded against that slot now display
  // under this number; nothing needs moving, because the key was the slot.
  function setSlotJersey(slot, raw) {
    const o = normalizeOpponent();
    if (!Number.isInteger(slot) || slot < 0 || slot > 5) return;
    const jersey = cleanJersey(raw);
    editingOppSlot = false;
    if (!jersey) { render(); return; }         // reject empty, put the UI back
    const previous = o.order[slot];
    if (previous === jersey) { render(); return; }

    pushHistory();
    o.order[slot] = jersey;
    // Their subs enter in the same position (15.3.2), so a slot changing
    // mid-set is normal. Log it rather than silently overwriting.
    if (previous) {
      state.substitutions.unshift({
        kind: 'oppServer',
        slot: slot,
        fromJersey: previous,
        toJersey: jersey,
        setNumber: state.setNumber,
        score: state.ourScore + "-" + state.theirScore
      });
    }
    render();
  }

  function setOppServerJersey(raw) {
    const o = normalizeOpponent();
    if (o.serverIdx === null) return;
    setSlotJersey(o.serverIdx, raw);
  }

  function setOpponentName(raw) {
    const o = normalizeOpponent();
    const name = String(raw == null ? '' : raw).trim().slice(0, 40);
    if (name === o.name) return;
    pushHistory();
    o.name = name;
    render();
  }

  // --------- Opponent library (jersey numbers, dates and counts only) ---------

  function getOpponentLibrary() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_OPPONENTS);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function setOpponentLibrary(lib) {
    try {
      localStorage.setItem(STORAGE_KEY_OPPONENTS, JSON.stringify(lib));
    } catch (e) {
      // ignore storage errors
    }
  }

  // Records the current set against the team name. Keyed by date + set number
  // so saving mid-set and then ending the set updates one record instead of
  // writing two. Needs a team name to file it under; silent no-op without one.
  function recordCurrentOpponentSet() {
    const o = normalizeOpponent();
    if (!o.name) return false;
    const hasAnything = o.order.some(j => j !== null) || Object.keys(o.conceded).length > 0;
    if (!hasAnything) return false;

    const now = new Date();
    const day = now.toISOString().slice(0, 10);
    const lib = getOpponentLibrary();
    const entry = lib[o.name] && typeof lib[o.name] === 'object' ? lib[o.name] : { sets: [] };
    if (!Array.isArray(entry.sets)) entry.sets = [];

    const record = {
      date: day,
      setNumber: state.setNumber,
      order: o.order.slice(),
      conceded: JSON.parse(JSON.stringify(o.conceded))
    };
    const existing = entry.sets.findIndex(
      s => s && s.date === day && s.setNumber === state.setNumber
    );
    if (existing === -1) entry.sets.push(record);
    else entry.sets[existing] = record;

    entry.lastSeen = now.toISOString();
    lib[o.name] = entry;
    setOpponentLibrary(lib);
    return true;
  }

  function deleteOpponent(name) {
    if (!confirm(`Delete everything recorded for "${name}"? This cannot be undone.`)) return;
    const lib = getOpponentLibrary();
    delete lib[name];
    setOpponentLibrary(lib);
    render();
  }

  // --------- Rendering ---------

  // "Pts: 12 / 38", with a marker once the player has cleared the target.
  function buildPlayerMeta(player) {
    const target = getPlayingTimeTarget();
    const metaDiv = document.createElement('div');
    metaDiv.className = 'player-meta';
    metaDiv.textContent = "Pts: " + player.points + "/" + target;
    if (player.points >= target) {
      const metSpan = document.createElement('span');
      metSpan.className = 'target-met';
      metSpan.textContent = '25% ✓';
      metaDiv.appendChild(metSpan);
    }
    return metaDiv;
  }

  function render() {
    syncSetParticipants();
    // Normalize so legacy states persist a real target instead of nothing.
    state.playingTimeTarget = getPlayingTimeTarget();
    document.getElementById('target-input').value = state.playingTimeTarget;

    document.getElementById('our-score').textContent = state.ourScore;
    document.getElementById('their-score').textContent = state.theirScore;
    document.getElementById('set-number').textContent = state.setNumber;

    const servingElem = document.getElementById('serving-indicator');
    servingElem.textContent = state.serving === 'us' ? 'Us' : 'Them';
    servingElem.classList.toggle('serving-us', state.serving === 'us');
    servingElem.classList.toggle('serving-them', state.serving === 'them');

    const subBtn = document.getElementById('sub-mode-btn');
    if (state.subMode) {
      subBtn.textContent = "Sub Mode: On";
      subBtn.classList.add('toggle-on');
    } else {
      subBtn.textContent = "Sub Mode: Off";
      subBtn.classList.remove('toggle-on');
    }

    updateUndoButton();
    renderStrip();

    // Court: position layout [4,3,2,5,6,1] = top-left -> bottom-right
    const positionOrder = [4, 3, 2, 5, 6, 1];
    const court = document.getElementById('court');
    court.innerHTML = '';
    const pending = state.pendingSub;

    for (let i = 0; i < 6; i++) {
      const posNumber = positionOrder[i];
      const cell = document.createElement('div');
      cell.className = 'court-cell';

      const label = document.createElement('div');
      label.className = 'pos-label';
      label.textContent = "Pos " + posNumber;
      cell.appendChild(label);

      const playerId = getPlayerIdAtPosition(posNumber);
      if (!playerId) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'player-card empty';
        emptyDiv.textContent = 'Empty';
        cell.appendChild(emptyDiv);
      } else {
        const player = getPlayerById(playerId);
        const card = document.createElement('div');
        card.className = 'player-card';
        card.dataset.playerId = playerId;
