        card.dataset.group = 'court';

        if (pending && pending.group === 'court' && pending.playerId === playerId) {
          card.classList.add('sub-pending');
        }

        const nameDiv = document.createElement('div');
        nameDiv.className = 'player-name';
        nameDiv.textContent = player.name;

        const metaDiv = buildPlayerMeta(player);

        card.appendChild(nameDiv);
        card.appendChild(metaDiv);

        card.addEventListener('click', () => handlePlayerClick('court', playerId));

        cell.appendChild(card);
      }

      court.appendChild(cell);
    }

    // Bench
    const benchList = document.getElementById('bench-list');
    benchList.innerHTML = '';

    const notYetIn = benchPlayersNotYetIn();

    state.bench.forEach(id => {
      const player = getPlayerById(id);
      if (!player) return;
      const card = document.createElement('div');
      card.className = 'player-card';
      card.dataset.playerId = id;
      card.dataset.group = 'bench';

      if (pending && pending.group === 'bench' && pending.playerId === id) {
        card.classList.add('sub-pending');
      }

      const nameDiv = document.createElement('div');
      nameDiv.className = 'player-name';
      nameDiv.textContent = player.name;

      const metaDiv = buildPlayerMeta(player);

      card.appendChild(nameDiv);
      card.appendChild(metaDiv);

      if (notYetIn.indexOf(id) !== -1) {
        const flagDiv = document.createElement('div');
        flagDiv.className = 'not-in-yet';
        flagDiv.textContent = 'not in yet';
        card.appendChild(flagDiv);
      }

      card.addEventListener('click', () => handlePlayerClick('bench', id));

      benchList.appendChild(card);
    });

    const benchNote = document.getElementById('bench-participation');
    if (notYetIn.length === 0) {
      benchNote.textContent = state.bench.length
        ? `All bench players have been in set ${state.setNumber}.`
        : '';
    } else {
      benchNote.textContent =
        `${notYetIn.length} not in set ${state.setNumber} yet: ` +
        notYetIn.map(getPlayerName).join(', ');
    }

    // Game log (subs + set ends)
    const subsLog = document.getElementById('subs-log-list');
    subsLog.innerHTML = '';
    state.substitutions.forEach(entry => {
      if (entry.kind === 'timeout') {
        const toDiv = document.createElement('div');
        toDiv.className = 'sub-entry';
        toDiv.textContent = `Set ${entry.setNumber} @ ${entry.score}: timeout ${entry.team} (${entry.remaining} left)`;
        subsLog.appendChild(toDiv);
        return;
      }

      const div = document.createElement('div');
      div.className = 'sub-entry';

      if (entry.kind === 'setEnd') {
        div.textContent = `End Set ${entry.setNumber}: ${entry.score}`;
      } else if (entry.kind === 'oppServer') {
        div.textContent = `Set ${entry.setNumber} @ ${entry.score}: their slot ${entry.slot + 1} #${entry.fromJersey} -> #${entry.toJersey}`;
      } else {
        // substitution (backward compatible with older saves)
        const inName = getPlayerName(entry.inId);
        const outName = getPlayerName(entry.outId);
        div.textContent = `Set ${entry.setNumber} @ ${entry.score}: ${inName} in for ${outName}`;
      }

      subsLog.appendChild(div);
    });

    renderOpponent();

    // Save current state automatically & refresh saved list UI
    saveAutoState();
    refreshSavedGamesDropdown();
    renderRallyExtras();
  }

  // The clock ticks on its own between points, so it is split out and can be
  // refreshed without touching the rest of the screen or saving anything.
  function renderClock() {
    const readout = document.getElementById('clock-readout');
    if (!readout) return;
    const log = rallyLog();
    if (!log.length) { readout.textContent = ''; return; }
    const now = Date.now();
    const setStart = firstRallyTimeInSet(state.setNumber);
    const matchStart = firstRallyTimeInMatch();
    const setPart = setStart === null ? '0:00' : formatClock(now - setStart);
    readout.textContent = `Set ${setPart} · Match ${formatClock(now - matchStart)}`;
  }

  // Medals are attached after the cards are built rather than inside the card
  // code, so the tier feature stays in one place.
  function decoratePlayerCardsWithMedals() {
    const cards = document.querySelectorAll('.player-card[data-player-id]');
    Array.prototype.forEach.call(cards, card => {
      const id = parseInt(card.dataset.playerId, 10);
      const player = getPlayerById(id);
      if (!player) return;
      const dot = document.createElement('span');
      const tier = tierOf(player);
      dot.className = 'medal medal-' + tier;
      dot.title = 'serving tier: ' + tier;
      dot.addEventListener('click', e => {
        e.stopPropagation();   // not a substitution tap
        cycleServeTier(id);
      });
      const nameDiv = card.querySelector('.player-name');
      (nameDiv || card).appendChild(dot);
    });
  }

  // "Next up: #7 about 1.4 points (guess) - #12 about 0.8 (guess)". Counts and
  // the coach's own medal, side by side. No advice about either.
  function renderNextUp() {
    const line = document.getElementById('next-up');
    line.innerHTML = '';
    const ids = upcomingServerIds();
    if (!ids.length) return;

    const stats = serveStatsFromLog();
    const label = document.createElement('span');
    label.textContent = 'Next up:';
    line.appendChild(label);

    ids.forEach((id, index) => {
      const player = getPlayerById(id);
      if (!player) return;
      const rating = serveRatingFor(id, stats);

      const chunk = document.createElement('span');
      const dot = document.createElement('span');
      dot.className = 'medal medal-' + rating.tier;
      dot.title = 'serving tier: ' + rating.tier;
      chunk.appendChild(dot);

      const who = player.jersey ? ('#' + player.jersey) : player.name;
      const text = document.createElement('span');
      text.textContent = ` ${who} about ${rating.expectedPoints.toFixed(1)}` +
        `${index === 0 ? ' points' : ''} (${rating.confidence})` +
        (index < ids.length - 1 ? ' ·' : '');
      chunk.appendChild(text);
      line.appendChild(chunk);
    });
  }

  function renderRallyExtras() {
    renderClock();
    decoratePlayerCardsWithMedals();
    renderNextUp();

    const capSelect = document.getElementById('serve-cap-select');
    capSelect.value = getServeCap() === null ? 'none' : String(SERVE_CAP_POINTS);

    const tap = document.getElementById('serve-miss-tap');
    const available = serveMissAvailable();
    tap.hidden = !available;
    tap.classList.toggle('flagged', available && !!lastRally().serveMiss);

    const toggle = document.getElementById('chance-toggle-btn');
    toggle.textContent = state.showSetChance ? 'Set chance: On' : 'Set chance: Off';
    toggle.classList.toggle('toggle-on', !!state.showSetChance);

    // Computed on every point regardless; shown only when asked for.
    const chance = document.getElementById('set-chance');
    const played = state.ourScore + state.theirScore;
    if (!state.showSetChance) {
      chance.hidden = true;
      chance.textContent = '';
    } else {
      chance.hidden = false;
      // The last record already holds the chance from this exact position, so
      // reuse it rather than running two thousand more simulations per click.
      const last = lastRally();
      const matches = last && last.set === state.setNumber &&
        last.ourScore === state.ourScore && last.theirScore === state.theirScore &&
        typeof last.pWin === 'number';
      const pct = Math.round((matches ? last.pWin : setChance()) * 100);
      chance.textContent = `Set chance ${pct}% (${chanceLabel(played)})`;
    }

    renderGridPanel();
    renderReviewPanel();
  }

  // "Their server: #12  next #4", or a box to type the jersey when the slot
  // is still unknown. "next" only once all six slots are known, because until
  // then it would be a guess.
  function buildOppServerControl(control, o) {
    control.innerHTML = '';
    control.classList.remove('opp-run');
    if (state.serving !== 'them' || o.serverIdx === null) return;

    const notable = oppRunIsNotable();
    if (notable) control.classList.add('opp-run');

    const jersey = o.order[o.serverIdx];
    const shown = document.createElement('span');
    shown.className = 'opp-jersey';
    shown.textContent = 'Their server: ' + oppSlotLabel(o, o.serverIdx);
    control.appendChild(shown);

    // The count is the message. No instruction to the coach.
    if (notable) {
      const run = document.createElement('span');
      run.className = 'opp-run-count';
      run.textContent = ': ' + o.run + ' straight';
      control.appendChild(run);
    }

    // Unknown slot, or correcting a known one: the box is right here, so
    // entry is a tap on the current slot rather than a prompt.
    if (!jersey || editingOppSlot) {
      const input = document.createElement('input');
      input.id = 'opp-server-input';
      input.type = 'text';
      input.inputMode = 'numeric';
      input.value = jersey || '';
      input.addEventListener('change', e => setOppServerJersey(e.target.value));
      input.addEventListener('blur', e => setOppServerJersey(e.target.value));
      control.appendChild(input);
      return;
    }

    if (oppOrderComplete()) {
      const nextSpan = document.createElement('span');
      nextSpan.textContent = 'next ' + oppSlotLabel(o, (o.serverIdx + 1) % 6);
      control.appendChild(nextSpan);
    }

    const edit = document.createElement('span');
    edit.className = 'opp-link';
    edit.textContent = 'wrong number?';
    edit.addEventListener('click', () => { editingOppSlot = true; render(); });
    control.appendChild(edit);
  }

  // Six fields for the whole serving order, for a coach who has their lineup
  // sheet at the start of a set. Entirely optional.
  function buildOppOrderRow(row, o) {
    row.innerHTML = '';
    const label = document.createElement('span');
    label.className = 'small-label';
    label.textContent = 'Their serving order';
    row.appendChild(label);

    for (let slot = 0; slot < 6; slot++) {
      const input = document.createElement('input');
      input.className = 'opp-slot-input';
      input.type = 'text';
      input.inputMode = 'numeric';
      input.placeholder = String(slot + 1);
      input.value = o.order[slot] || '';
      if (o.serverIdx === slot) input.classList.add('serving-slot');
      input.addEventListener('change', e => setSlotJersey(slot, e.target.value));
      row.appendChild(input);
    }
  }

  // Reports jersey numbers and counts. No evaluation of the opposing players.
  function renderOpponent() {
    const o = normalizeOpponent();

    const nameInput = document.getElementById('opponent-name');
    if (document.activeElement !== nameInput) nameInput.value = o.name;

    // Server control: only while they are serving, to keep the line quiet.
    // Every point re-renders, so leave the box alone while it is being typed
    // in or a half-entered jersey would vanish.
    const control = document.getElementById('opp-server-control');
    const active = document.activeElement;
    if (!(active && active.id === 'opp-server-input')) {
      buildOppServerControl(control, o);
    }

    const orderRow = document.getElementById('opp-order-row');
    orderRow.hidden = !oppOrderRowOpen;
    const typingSlot = !!(active && active.classList && active.classList.contains('opp-slot-input'));
    if (oppOrderRowOpen && !typingSlot) {
      buildOppOrderRow(orderRow, o);
    }

    const carried = document.getElementById('opp-carried-note');
    carried.textContent = (o.carriedFrom && o.order.some(j => j !== null))
      ? `Their order carried from set ${o.carriedFrom}; edit if they changed it.`
      : '';

    // Points they scored while each slot served, this set. Keyed by slot, so
    // a slot with no jersey yet still shows its count.
    const conceded = document.getElementById('opp-conceded');
    const parts = [];
    for (let slot = 0; slot < 6; slot++) {
      const points = o.conceded[String(slot)];
      if (points) parts.push(oppSlotLabel(o, slot) + ' ' + points);
    }
    conceded.textContent = parts.length
      ? 'Their points by server: ' + parts.join(' · ')
      : '';

    // Opponent library, collapsed by default.
    const panel = document.getElementById('opponents-panel');
    panel.hidden = !opponentsPanelOpen;
    panel.innerHTML = '';
    if (opponentsPanelOpen) {
      const lib = getOpponentLibrary();
      const names = Object.keys(lib).sort();
      if (!names.length) {
        const empty = document.createElement('div');
        empty.className = 'small-label';
        empty.textContent = 'No opponents recorded yet.';
        panel.appendChild(empty);
      }
      names.forEach(name => {
        const entry = lib[name] || {};
        const sets = Array.isArray(entry.sets) ? entry.sets : [];
        const row = document.createElement('div');
        row.className = 'opp-entry';

        const text = document.createElement('div');
        const seen = entry.lastSeen ? new Date(entry.lastSeen).toLocaleDateString() : 'unknown';
        text.textContent = `${name} - last seen ${seen} - ${sets.length} set${sets.length === 1 ? '' : 's'}`;
        row.appendChild(text);

        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.addEventListener('click', () => deleteOpponent(name));
        row.appendChild(del);

        panel.appendChild(row);
      });
    }
  }

  // --------- Event wiring ---------

    loadAutoStateIfAny();

    document.getElementById('load-lineup-btn').addEventListener('click', loadLineupFromTextarea);
    document.getElementById('serve-miss-tap').addEventListener('click', toggleServeMiss);
    document.getElementById('grid-toggle-btn').addEventListener('click', () => {
      gridPanelOpen = !gridPanelOpen;
      render();
    });
    document.getElementById('review-toggle-btn').addEventListener('click', () => {
      reviewPanelOpen = !reviewPanelOpen;
      render();
    });
    integrateWithOpponentLibrary();
    document.getElementById('chance-toggle-btn').addEventListener('click', toggleSetChance);
    document.getElementById('export-rallies-btn').addEventListener('click', exportRallyLog);
    document.getElementById('serve-cap-select')
      .addEventListener('change', e => setServeCap(e.target.value));
    // The set clock is wall-clock, so it moves without any state change.
    setInterval(renderClock, 1000);
    document.getElementById('rotate-forward-btn').addEventListener('click', rotateForward);
    document.getElementById('rotate-back-btn').addEventListener('click', rotateBackward);
    document.getElementById('score-us-btn').addEventListener('click', () => scorePoint('us'));
    document.getElementById('score-them-btn').addEventListener('click', () => scorePoint('them'));
    document.getElementById('serving-indicator').addEventListener('click', toggleServing);
    document.getElementById('timeout-us-btn').addEventListener('click', () => takeTimeout('us'));
    document.getElementById('timeout-them-btn').addEventListener('click', () => takeTimeout('them'));
    document.getElementById('strip-toggle-btn').addEventListener('click', toggleStrip);
    document.getElementById('swap-at-input')
      .addEventListener('change', e => setSwapAt(e.target.value));
    document.getElementById('sub-mode-btn').addEventListener('click', toggleSubMode);
    document.getElementById('new-set-btn').addEventListener('click', newSet);
    document.getElementById('reset-btn').addEventListener('click', resetApp);
    document.getElementById('undo-btn').addEventListener('click', undoLast);
    document.getElementById('target-input')
      .addEventListener('change', e => setPlayingTimeTarget(e.target.value));

    document.getElementById('save-game-btn').addEventListener('click', saveCurrentGameAsSnapshot);
    document.getElementById('load-game-btn').addEventListener('click', loadSelectedSavedGame);
    document.getElementById('delete-game-btn').addEventListener('click', deleteSelectedSavedGame);

    // Opponent controls. Commit on change/blur so typing does not spam undo.
    document.getElementById('opponent-name')
      .addEventListener('change', e => setOpponentName(e.target.value));
    document.getElementById('opponent-name')
      .addEventListener('blur', e => setOpponentName(e.target.value));
    document.getElementById('opp-order-btn').addEventListener('click', () => {
      oppOrderRowOpen = !oppOrderRowOpen;
      render();
    });
    document.getElementById('opponents-btn').addEventListener('click', () => {
      opponentsPanelOpen = !opponentsPanelOpen;
      render();
    });

    render();
  });

  // --------- Lineup import from a QR code or link ---------
  //
  // The coach builds the lineup on a laptop and scans a QR with the phone that
  // runs this. The carrier is "<tracker url>/#import=<payload>", where payload
  // is base64url of one player per line in serving order. A fragment is never
  // sent to a server, and it is stripped again as soon as it is read, so the
  // lineup does not sit in the address bar or in history.
  //
  // The payload carries jersey numbers and "First L." only.

  const IMPORT_PREFIX = '#import=';

  // RFC 4648 section 5, and tolerant of the padding a generator may omit.
  function decodeBase64Url(payload) {
    const raw = String(payload == null ? '' : payload).trim();
    if (!raw || /[^A-Za-z0-9\-_=]/.test(raw)) return null;
    let b64 = raw.replace(/-/g, '+').replace(/_/g, '/').replace(/=+$/, '');
    while (b64.length % 4 !== 0) b64 += '=';
    try {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      // fatal so that bytes which are not UTF-8 fail here rather than arriving
      // as replacement characters in somebody's name
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      return null;
    }
  }

  // Lines starting with # are comments. "#set=2" says which set the lineup is
  // for; it is reported and never treated as a player.
  function parseImportedLineup(text) {
    if (typeof text !== 'string') return null;
    const lines = [];
    let setNumber = null;
    text.split(/\r?\n/).forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) return;
      if (trimmed.charAt(0) === '#') {
        const m = /^#\s*set\s*=\s*(\d{1,2})\s*$/i.exec(trimmed);
        if (m) setNumber = parseInt(m[1], 10);
        return;
      }
      lines.push(trimmed);
    });
    if (!lines.length) return null;
    return { lines: lines, setNumber: setNumber };
  }

  function applyImportedLineup(parsed) {
    const input = document.getElementById('lineup-input');
    if (!input) return;
    input.value = parsed.lines.join('\n');
    // the normal path, so this pushes history and Undo puts the old lineup back
    loadLineupFromTextarea();
  }

  function processImportPayload(payload) {
    const text = decodeBase64Url(payload);
    const parsed = text === null ? null : parseImportedLineup(text);
    if (!parsed) {
      alert('That link did not hold a lineup.');
      return false;
    }
    const count = parsed.lines.length;
    const plural = count === 1 ? 'player' : 'players';
    const setPart = parsed.setNumber ? `, set ${parsed.setNumber}` : '';
    if (!confirm(`Load this lineup (${count} ${plural}${setPart})? Replaces the current lineup box.`)) {
      return false;
    }
    applyImportedLineup(parsed);
    return true;
  }

  function clearImportHash() {
    try {
      if (window.history && typeof history.replaceState === 'function') {
        history.replaceState(null, '', location.pathname + location.search);
        return;
      }
    } catch (e) {
      // fall through
    }
    try { location.hash = ''; } catch (e) {}
  }

  // Runs on load and again whenever the fragment changes, so scanning a second
  // code into an already-open tracker works.
  function handleImportHash() {
    const hash = String(location.hash || '');
    if (hash.indexOf(IMPORT_PREFIX) !== 0) return false;
    const payload = hash.slice(IMPORT_PREFIX.length);
    // stripped first, so it is gone whether the coach accepts, cancels, or the
    // payload was malformed
    clearImportHash();
    return processImportPayload(payload);
  }

  function importFromScannedUrl(url) {
    const at = String(url == null ? '' : url).indexOf(IMPORT_PREFIX);
    if (at === -1) {
      alert('That link did not hold a lineup.');
      return false;
    }
    return processImportPayload(String(url).slice(at + IMPORT_PREFIX.length));
  }

  // Android Chrome has BarcodeDetector; iOS opens the URL from its own camera
  // app instead, so the button stays hidden there rather than offering
  // something that cannot work.
  function scanningSupported() {
    return typeof window !== 'undefined' &&
      typeof window.BarcodeDetector === 'function' &&
      !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function stopLineupScan(stream) {
    const holder = document.getElementById('scan-holder');
    if (stream) {
      try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    }
    if (holder) { holder.hidden = true; holder.innerHTML = ''; }
  }

  function startLineupScan() {
    if (!scanningSupported()) return;
    const holder = document.getElementById('scan-holder');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        const video = document.createElement('video');
        video.setAttribute('playsinline', '');
        video.muted = true;
        video.srcObject = stream;

        const hint = document.createElement('div');
        hint.className = 'small-label scan-hint';
        hint.textContent = 'Point at the code. Tap the picture to stop.';

        holder.innerHTML = '';
        holder.appendChild(video);
        holder.appendChild(hint);
        holder.hidden = false;
        holder.addEventListener('click', () => stopLineupScan(stream), { once: true });
        video.play();

        const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        const tick = () => {
          if (holder.hidden) return;
          detector.detect(video).then(codes => {
            if (codes && codes.length && codes[0].rawValue) {
              const value = codes[0].rawValue;
              stopLineupScan(stream);
              importFromScannedUrl(value);
              return;
            }
            setTimeout(tick, 300);
          }).catch(() => setTimeout(tick, 300));
        };
        tick();
      })
      .catch(() => {
        alert('No camera available on this device.');
      });
  }

  function wireLineupImport() {
    const scanBtn = document.getElementById('scan-qr-btn');
    if (scanBtn && scanningSupported()) {
      scanBtn.hidden = false;
      scanBtn.addEventListener('click', startLineupScan);
    }
    window.addEventListener('hashchange', handleImportHash);
    handleImportHash();
  }

  // Registered after the main handler above, so the saved game is restored
  // first and an imported lineup is not overwritten by it.
  document.addEventListener('DOMContentLoaded', wireLineupImport);
</script>
</body>
</html>
